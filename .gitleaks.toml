title = "RevMatrix-AI Gitleaks Config"

[allowlist]
description = "Global Allowlist for Test Fixtures, Mock Keys, and Examples"
paths = [
  '''\.env\.example''',
  '''tests/''',
  '''data/''',
  '''scripts/''',
  '''BENCHMARK_RESULTS\.json''',
  '''package-lock\.json'''
]
regexes = [
  '''AIzaSy[a-zA-Z0-9_\-]{33}''',
  '''rzp_test_[a-zA-Z0-9]{14}''',
  '''AIzaSy_your_gemini_mock''',
  '''postgres://postgres:[a-zA-Z0-9]+@'''
]
