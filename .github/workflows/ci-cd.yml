name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scan (Gitleaks & Security Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Security Audit
        run: npm audit --audit-level=critical

  typecheck-and-lint:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint

  run-tests-and-benchmark:
    name: Run Tests & Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test
      - run: npm run test:benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AIzaSy_mock_key_for_ci_testing_only_33' }}

  build-verification:
    name: Build Verification
    needs: [typecheck-and-lint, run-tests-and-benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgres://postgres:postgres@localhost:5432/postgres"
          GEMINI_API_KEY: "AIzaSy_mock_key_for_ci_testing_only_33"
          RAZORPAY_KEY_ID: "rzp_test_mock_key_12345"
          RAZORPAY_KEY_SECRET: "mock_secret_123456789"
          RAZORPAY_WEBHOOK_SECRET: "mock_webhook_secret_123"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
